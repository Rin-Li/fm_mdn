  _target_: pfp.policy.fm_so3_policy.FMSO3Policy
  x_dim: ${x_dim}
  y_dim: ${y_dim}
  n_obs_steps: ${n_obs_steps}
  n_pred_steps: ${n_pred_steps}
  num_k_infer: 10
  norm_pcd_center: [0.4, 0.0, 1.4]
  augment_data: False
  loss_type: l2  # l2 | l1
  flow_schedule: exp  # linear | cosine | exp
  exp_scale: 4.0
  snr_sampler: uniform  # uniform | logit_normal
  noise_type: uniform  # uniform | biased
  so3_init_mode: random  # random | learned
  so3_prior_ckpt_name: null
  so3_prior_ckpt_episode: latest-rank0.pt

  obs_encoder: ${backbone}
  
  diffusion_net:
    _target_: diffusion_policy.model.diffusion.conditional_unet1d.ConditionalUnet1D
    input_dim: ${y_dim}
    output_dim: 7
    global_cond_dim: "${eval: '${x_dim} * ${n_obs_steps}'}"
    diffusion_step_embed_dim: 256
    down_dims: [256, 512, 1024]
    kernel_size: 5
    n_groups: 8
    cond_predict_scale: True

  loss_weights:
    xyz: 10.0
    so3: 10.0
    grip: 1.0
